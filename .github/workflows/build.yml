name: Build IT-Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: it-master-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create . --platforms=android --org ru.mrcmrb

      - name: Configure permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          python3 - <<'PY'
          import os
          from pathlib import Path
          props = {
              "storeFile": "app/upload-keystore.p12",
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          Path("android/key.properties").write_text(
              "".join(f"{k}={v}\\n" for k, v in props.items()),
              encoding="utf-8",
          )
          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")
          kts_signing = """    val keystoreProperties = Properties()
              val keystorePropertiesFile = rootProject.file("key.properties")
              if (!keystorePropertiesFile.exists()) {
                  throw GradleException("Android signing properties were not created")
              }
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storeType = "PKCS12"
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

          """
          if gradle_kts.exists():
              p = gradle_kts
              s = p.read_text()
              if "import java.util.Properties" not in s:
                  s = "import java.util.Properties\\nimport java.io.FileInputStream\\n\\n" + s
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle.kts")
              if 'create("release")' not in s:
                  s = s.replace(marker, kts_signing + marker, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              if old not in s:
                  raise SystemExit("Could not find default release signing config in build.gradle.kts")
              s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")', 1)
              p.write_text(s)
          elif gradle_groovy.exists():
              p = gradle_groovy
              s = p.read_text()
              groovy_signing = """    def keystoreProperties = new java.util.Properties()
              def keystorePropertiesFile = rootProject.file("key.properties")
              if (!keystorePropertiesFile.exists()) {
                  throw new GradleException("Android signing properties were not created")
              }
              keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))

              signingConfigs {
                  release {
                      storeFile rootProject.file(keystoreProperties["storeFile"])
                      storeType "PKCS12"
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }

          """
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle")
              if "signingConfigs {" not in s:
                  s = s.replace(marker, groovy_signing + marker, 1)
              import re
              s, count = re.subn(r'(release\\s*\\{[^{}]*?)signingConfig\\s+signingConfigs\\.debug', r'\\1signingConfig signingConfigs.release', s, count=1, flags=re.S)
              if count == 0:
                  raise SystemExit("Could not find default release signing config in build.gradle")
              p.write_text(s)
          else:
              raise SystemExit("No Android app Gradle file found")
          print("Permanent Android signing configured from protected workflow secrets.")
          PY
          keytool -list -keystore android/app/upload-keystore.p12 -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Signing keystore and alias verified."

      - name: Configure Android biometric authentication
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.kt -o -name MainActivity.java | head -n 1)
          if [ -z "$MAIN_ACTIVITY" ]; then echo "MainActivity not found"; exit 1; fi
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN_ACTIVITY"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml

      - name: Create custom app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_custom.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#071426" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#123B68" android:pathData="M54,7a47,47 0,1 0,0 94a47,47 0,1 0,0 -94"/>
              <path android:fillColor="#20B8FF" android:pathData="M54,12a42,42 0,1 0,0 84a42,42 0,1 0,0 -84M54,22a32,32 0,1 1,0 64a32,32 0,1 1,0 -64"/>
              <path android:fillColor="#EAF5FF" android:pathData="M28,32h52a5,5 0,0 1,5 5v34a5,5 0,0 1,-5 5h-52a5,5 0,0 1,-5 -5v-34a5,5 0,0 1,5 -5z"/>
              <path android:fillColor="#0B2A4D" android:pathData="M33,38h42v27h-42z"/>
              <path android:fillColor="#20B8FF" android:pathData="M49,75h10v5h-10zM42,80h24v4h-24z"/>
              <path android:fillColor="#EAF5FF" android:pathData="M39,45l4,-4 8,8 8,-8 4,4 -8,8 8,8 -4,4 -8,-8 -8,8 -4,-4 8,-8z"/>
              <path android:fillColor="#FF5364" android:pathData="M66,44l4,4 -15,15 -4,-4z"/>
          </vector>
          EOF
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher_custom"|' android/app/src/main/AndroidManifest.xml

      - name: Prepare offline Cyrillic PDF font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p assets/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf assets/fonts/DejaVuSans.ttf

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run automated tests
        run: flutter test

      - name: Build versioned APK
        run: |
          flutter build apk --release \
            --build-name=2.0.3 \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=2.0.3+${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Master-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
